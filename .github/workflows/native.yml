name: Native Desktop and model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    # Dedicated interactive hosts with Hermes, a configured model, this exact
    # candidate installed, and loopback CDP enabled. Never run untrusted PRs here.
    strategy:
      fail-fast: false
      matrix:
        os: [Windows, macOS, Linux]
    runs-on: [self-hosted, sound-studio-native, '${{ matrix.os }}']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/native-desktop-proof.py --allow-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification-${{ matrix.os }}
          path: evidence/native/verification.json
          if-no-files-found: error
